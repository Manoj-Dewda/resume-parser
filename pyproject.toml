[project]
name = "resume-parser"
version = "0.1.0"
description = "Resume parsing and search engine"
authors = [
    { name = "Manoj-Dewda", email = "dewdamanoj9@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.18.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "python-dotenv",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "parser"
module-root = "packages"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages", "eval"]
